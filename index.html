function stageSym(p){
  var res={},w=S.week,from=add(w,-21);
  STAGES.forEach(function(s){res[s]='none'});
  var by={};STAGES.forEach(function(s){by[s]=[]});
  IX.tasksBy[p.ma].forEach(function(t){if(t._stage&&t.cap==='hangmuc')by[t._stage].push(t)});
  STAGES.forEach(function(s){
    var items=by[s],cons=0,done=0,run=0,recent=0;
    items.forEach(function(t){
      var st=tStatus(t),ns=notesIn(IX.notesByTask[t.id]||[],from,w).length;
      if(st||ns){cons++}
      if(DONE.indexOf(st)>=0)done++;

      if(ns)recent++;
    });
    if(!cons)res[s]='none';else if(done===cons)res[s]='done';else if(run||recent)res[s]='run';else if(done)res[s]='part';else res[s]='none';
  });

function saved(el){el.classList.remove('err');el.classList.add('ok');setTimeout(function(){el.classList.remove('ok')},1200)}
function bindEdit(v){
  v.querySelectorAll('tr.erow').forEach(function(tr){
    var id=tr.dataset.t,t=IX.task[id];
    tr.querySelectorAll('[data-f]').forEach(function(el){el.onchange=function(){
      var k=el.dataset.f,val=el.value;if(k==='ten'&&!val.trim()){el.value=t.ten;toast('Tên hạng mục không được để trống');return}
      var pl={id:id};pl[k]=val;
      api.updateTask(pl).then(function(ch){Object.assign(t,ch);index();saved(el)}).catch(function(e){el.classList.add('err');err(e)});
    }});
    tr.querySelectorAll('[data-nf]').forEach(function(el){el.onchange=function(){
      var n=S.data.BaoCaoTuan.filter(function(x){return x.id===el.dataset.n})[0];if(!n)return;
      var pl={id:n.id};
      if(el.dataset.nf==='tuan'){if(!el.value){el.value=n.tuan;return}pl.tuan=mon(el.value)}else{if(!el.value.trim()){el.value=n.noi_dung;toast('Muốn xóa ghi chú thì mở Lịch sử');return}pl.noi_dung=el.value.trim()}
      api.updateNote(pl).then(function(ch){Object.assign(n,ch);if(ch.tuan)el.value=ch.tuan;index();saved(el)}).catch(function(e){el.classList.add('err');err(e)});
    }});
    var nt=tr.querySelector('[data-new="noi_dung"]');
    if(nt)nt.onchange=function(){
      var txt=nt.value.trim();if(!txt)return;
      var day=tr.querySelector('[data-new="tuan"]').value||S.week;nt.disabled=true;
      api.addNote({ma_da:t.ma_da,cv_id:id,tuan:mon(day),loai:'Đã làm',loai_vm:'',noi_dung:txt}).then(function(r){S.data.BaoCaoTuan.push(r);index();
        nt.disabled=false;nt.dataset.new='';nt.dataset.nf='noi_dung';nt.dataset.n=r.id;var dd=tr.querySelector('[data-new="tuan"]');dd.dataset.new='';dd.dataset.nf='tuan';dd.dataset.n=r.id;dd.value=r.tuan;saved(nt);bindEdit(v)}).catch(function(e){nt.disabled=false;err(e)});
    };
    var del=tr.querySelector('[data-del]');
    if(del)del.onclick=function(){
      if(!del.dataset.ok){del.dataset.ok='1';del.textContent='Bấm lần nữa';return}
      api.deleteTask(id).then(function(){t.cap='xoa';index();tr.remove();toast('Đã bớt "'+short(t.ten,40)+'"')}).catch(err);
    };
    var op=tr.querySelector('[data-open]');if(op)op.onclick=function(){openTask(id)};
  });
}

function vMine(v){
  var w=S.week,prev=add(w,-7);
  if(!canReview())S.person=S.user.ten;
  else if(!S.person||IX.people.indexOf(S.person)<0)S.person=IX.people.indexOf(S.user.ten)>=0?S.user.ten:IX.people[0];
  var person=S.person,can=S.user.ten===person||canReview();
  var mine=S.data.CongViec.filter(function(t){return t.nguoi_pt===person&&t.cap!=='moc'&&t.cap!=='xoa'&&IX.pj[t.ma_da]&&IX.pj[t.ma_da].trang_thai==='Đang chạy'});
  var list=mine.filter(function(t){
    if(S.myFilter==='tat-ca')return true;
    var st=tStatus(t),ns=IX.notesByTask[t.id]||[];
    if(ns.some(function(n){return n.tuan===w}))return true;
    if(DONE.indexOf(st)>=0)return false;
    return RUN.indexOf(st)>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1)||ns.some(function(n){return n.tuan>=add(w,-28)&&n.tuan<w})||(t.deadline_cdt&&t.deadline_cdt>=w&&t.deadline_cdt<=add(w,28));
  });
  var dkey='qltk_draft_'+person+'_'+w,draft={};try{draft=JSON.parse(store(dkey)||'{}')}catch(e){}
  var saveDraft=function(){store(dkey,JSON.stringify(draft))};
  var planOf=function(t){

/* ================= BÁO CÁO TUẦN (THẺ) ================= */
/* Phân loại ghi chú theo 4 nút nhập: Đúng kế hoạch · Có thay đổi · Vướng · Không phát sinh.
   Ghi chú cũ (Excel, ô "Đã làm" tự do) tạm xếp vào "Có thay đổi". "KH tuần tới" hiện riêng. */
var KQ=[['gap','Gấp','‼'],['vm','Vướng','⚠'],['doi','Có thay đổi','✎'],['ok','Đúng kế hoạch','✓'],['khong','Không phát sinh','–']];
var KQK={};KQ.forEach(function(k){KQK[k[0]]=k});
/* Mức độ của ghi chú: admin chọn tay (cột muc_do) > tự suy theo cách nhập */
function kqOf(n){
  if(n.muc_do&&KQK[n.muc_do])return n.muc_do;
  if(n.nguon==='Excel gốc')return n.loai==='Vướng mắc'?'vm':'doi';
  if(n.loai==='KH tuần tới')return 'kh';
  if(n.loai==='Vướng mắc')return 'vm';
  var t=String(n.noi_dung||'');
  if(/^Đúng kế hoạch/.test(t))return 'ok';
  if(/^Không phát sinh/.test(t))return 'khong';
  return 'doi';
}
function lvlSel(n){return '<select class="lvl" data-lv="'+esc(n.id)+'" aria-label="Mức độ">'+'<option value="">Tự động</option>'+KQ.map(function(k){return '<option value="'+k[0]+'"'+(n.muc_do===k[0]?' selected':'')+'>'+k[2]+' '+k[1]+'</option>'}).join('')+'</select>'}
function bindLvl(el,after){
  el.querySelectorAll('select.lvl').forEach(function(sel){
    sel.onclick=function(e){e.stopPropagation()};
    sel.onchange=function(){
      var n=S.data.BaoCaoTuan.filter(function(x){return x.id===sel.dataset.lv})[0];if(!n)return;sel.disabled=true;
      api.updateNote({id:n.id,muc_do:sel.value}).then(function(ch){n.muc_do=sel.value;Object.assign(n,ch);index();toast('Đã đổi mức độ');render();if(after)after()}).catch(function(e){sel.disabled=false;err(e)});
    };
  });
}
function taskName(id){var t=IX.task[id];return t?(t.cap==='nhom'?t.ten_nhom:t.ten):''}
function cpBtn(attr,title){return '<button class="cp" '+attr+' title="'+(title||'Copy')+'" aria-label="'+(title||'Copy')+'">⧉</button>'}
function noteText(n){var tn=taskName(n.cv_id);return (tn?tn+': ':'')+String(n.noi_dung||'').trim()}
function pjWeekText(ma){var p=IX.pj[ma],w=S.week,ns=S.data.BaoCaoTuan.filter(function(n){return n.ma_da===ma&&n.tuan===w});
  var main=ns.filter(function(n){return kqOf(n)!=='kh'}).sort(function(a,b){return RANK[kqOf(a)]-RANK[kqOf(b)]}),plans=ns.filter(function(n){return kqOf(n)==='kh'});
  var out=[p.ten+' – Week '+weekNo(w)+' ('+dm(w)+'–'+dmy(add(w,6))+')'];
  main.forEach(function(n){out.push('- '+noteText(n).replace(/\n+/g,'\n  '))});
  if(plans.length){out.push('Next week:');plans.forEach(function(n){out.push('- '+noteText(n).replace(/\n+/g,'\n  '))})}
  if(!ns.length)out.push('(No update this week)');return out.join('\n')}
function copyText(t){var ok=function(){toast('Copied')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok).catch(function(){fallbackCopy(t)&&ok()});else if(fallbackCopy(t))ok()}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var r=false;try{r=document.execCommand('copy')}catch(e){}a.remove();if(!r)toast('Copy failed');return r}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.cp');if(!b)return;e.stopPropagation();e.preventDefault();
  if(b.dataset.cpj)return copyText(pjWeekText(b.dataset.cpj));
  var n=S.data&&S.data.BaoCaoTuan.filter(function(x){return x.id===b.dataset.cpn})[0];if(n)copyText(noteText(n))},true);
function blHtml(n,len){var t=IX.task[n.cv_id];return '<div class="bl '+kqOf(n)+'" data-t="'+esc(n.cv_id)+'">'+cpBtn('data-cpn="'+esc(n.id)+'"','Copy note')+(adm()?lvlSel(n):'')+'<b>'+esc(short(t?(t.cap==='nhom'?t.ten_nhom:t.ten):'',48))+'</b> '+esc(len?short(String(n.noi_dung).replace(/^Đúng kế hoạch:\s*/,''),len):n.noi_dung)+'</div>'}
var RANK={gap:0,vm:1,doi:2,ok:3,khong:4,kh:5};
function vBoard(v){
  var w=S.week,ps=projects(),notes=S.data.BaoCaoTuan.filter(function(n){return n.tuan===w});
  ps=ps.filter(function(p){return p.trang_thai==='Đang chạy'||notes.some(function(n){return n.ma_da===p.ma})});
  var tot={};KQ.forEach(function(k){tot[k[0]]=0});notes.forEach(function(n){var k=kqOf(n);if(tot[k]!=null&&(!S.luong||(IX.pj[n.ma_da]||{}).luong===S.luong))tot[k]++});
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Week '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Weekly Report</h1></div>'+luongSeg()+'</div>';
  html+='<div class="kqleg">'+KQ.map(function(k){return '<span class="kq '+k[0]+'"'+(tot[k[0]]?' data-go="'+k[0]+'" role="button" tabindex="0" title="Đi tới các ghi chú '+k[1]+'"':'')+'>'+k[2]+' '+k[1]+' <b class="mono">'+tot[k[0]]+'</b></span>'}).join('')+'</div>';
  LUONG.forEach(function(L){
    var g=ps.filter(function(p){return p.luong===L});if(!g.length)return;
    html+='<div class="bgrp lu-'+L+'">'+L+' · '+g.length+(g.length>1?' projects':' project')+'</div><div class="board">';
    g.forEach(function(p){
      var tg=tagOf(p.ma),ns=notes.filter(function(n){return n.ma_da===p.ma}),lw=lastWeek(p),age=lw?Math.round(days(lw,w)/7):null;
      var c={},plans=[],main=[];
      ns.forEach(function(n){var k=kqOf(n);if(k==='kh')plans.push(n);else{c[k]=(c[k]||0)+1;main.push(n)}});
      main.sort(function(a,b){return RANK[kqOf(a)]-RANK[kqOf(b)]});
      var who={};ns.forEach(function(n){if(n.nguoi_nhap)who[n.nguoi_nhap]=1});
      html+='<article class="bcard'+(tg?' tg-'+tg:'')+'" data-pj="'+p.ma+'"><div class="bh">'+pnHtml(p)+(p.trang_thai!=='Đang chạy'?'<span class="st stop">'+esc(STT_EN[p.trang_thai]||p.trang_thai)+'</span>':'')+KQ.map(function(k){return c[k[0]]?'<span class="kq '+k[0]+'">'+k[2]+' '+c[k[0]]+'</span>':''}).join('')+(ns.length?cpBtn('data-cpj="'+p.ma+'"','Copy this week\'s report'):'')+'</div>'+
        (main.length?'<div class="blist">'+main.slice(0,4).map(function(n){return blHtml(n,110)}).join('')+
          (main.length>4?'<a class="more" data-more="'+p.ma+'">+ '+(main.length-4)+' more notes</a>':'')+'</div>':'<div class="bempty">No update this week</div>')+
        (plans.length?'<div class="bplan"><b>Next week:</b> '+esc(short(plans.map(function(n){return n.noi_dung}).join(' · '),140))+'</div>':'')+
        ((IX.links[p.ma]||[]).length||canLinkNew(p.ma)?'<details class="bmore"><summary>Related documents ('+(IX.links[p.ma]||[]).length+')</summary>'+lkRow(p.ma)+(canLinkNew(p.ma)?'<a class="more" data-lk="'+p.ma+'">Manage links</a>':'')+'</details>':'')+
        '<div class="bf"><span>'+(lw?'Updated: <b class="mono">'+dmy(lw)+'</b>':'No updates yet')+(Object.keys(who).length?' · '+esc(Object.keys(who).join(', ')):'')+'</span>'+
        (lw&&age>0?'<span class="st '+(age>=2?'wait':'')+'">'+age+(age>1?' weeks':' week')+' ago</span>':'')+
        (adm()?'<select class="btag" data-rg="'+p.ma+'" aria-label="Tag '+esc(p.ten)+'"><option value="">No tag</option>'+TAGS.map(function(x){return '<option value="'+x+'"'+(tg===x?' selected':'')+'>Tag: '+TAG_EN[x]+'</option>'}).join('')+'</select>':'')+
        '</div></article>';
    });
    html+='</div>';
  });
  if(!ps.length)html+='<div class="panel"><div class="empty">Không có dự án nào trong bộ lọc này.</div></div>';
  v.innerHTML=html;bindLuong();
  v.querySelectorAll('.bl[data-t]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();openTask(e.dataset.t)}});
  v.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();openPjHistory(e.dataset.more)}});
  v.querySelectorAll('[data-lk]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();openLinks(e.dataset.lk)}});
  v.querySelectorAll('.bcard .bh .pn').forEach(function(e){e.style.cursor='pointer';e.title='Xem lịch sử báo cáo tuần';e.onclick=function(){openPjHistory(e.closest('.bcard').dataset.pj)}});
  v.querySelectorAll('.kqleg [data-go]').forEach(function(ch){var go1=function(){
    var k=ch.dataset.go,els=[].slice.call(v.querySelectorAll('.bl.'+k));
    if(!els.length){var pj=[].slice.call(v.querySelectorAll('.bcard')).filter(function(cd){return cd.querySelector('.bh .kq.'+k)});if(pj.length){pj[0].scrollIntoView({behavior:'smooth',block:'center'});return}toast('Không thấy ghi chú');return}
    var i=(S.goIdx&&S.goIdx.k===k?S.goIdx.i+1:0)%els.length;S.goIdx={k:k,i:i};
    var e=els[i];e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');
    if(els.length>1)toast((i+1)+'/'+els.length+' · bấm tiếp để tới ghi chú sau');

  v.querySelectorAll('select.btag').forEach(function(sel){sel.onclick=function(ev){ev.stopPropagation()};sel.onchange=function(){
    var ma=sel.dataset.rg,old=IX.review[ma+'|'+S.week]||{};sel.disabled=true;

      .then(function(r){S.data.DanhGiaTuan=S.data.DanhGiaTuan.filter(function(x){return !(x.ma_da===ma&&x.tuan===S.week)});S.data.DanhGiaTuan.push(r);index();toast(sel.value?'Tagged '+TAG_EN[sel.value]+': '+pjName(ma):'Tag removed: '+pjName(ma));render()}).catch(function(e){sel.disabled=false;err(e)});
  }});
}
/* Lịch sử báo cáo tuần của 1 dự án, từ tuần đang xem trở về trước */
function openPjHistory(ma){
  closeDrawer();
  var p=IX.pj[ma],w=S.week;if(!p)return;
  var ns=(IX.notesByPj[ma]||[]).filter(function(n){return n.tuan<=w}).slice().sort(function(a,b){return a.tuan===b.tuan?(RANK[kqOf(a)]-RANK[kqOf(b)]):(a.tuan<b.tuan?1:-1)});
  var by=[],cur=null;ns.forEach(function(n){if(!cur||cur.w!==n.tuan){cur={w:n.tuan,items:[]};by.push(cur)}cur.items.push(n)});

var BAN_COLOR=['#2F6FB3','#C46A10','#2E8B57','#8A4FBF','#B23A48','#4A6A8A','#0F8A8A'];

var ROLES=['Director','Unit lead','Head of dept','Discipline lead','Expert','Member','Collaborator','Intern'];
var KN_ROLES=['Unit lead','Head of dept','Deputy head','Discipline lead','Project manager','Other'];
var TYPES=['Staff','Collaborator','Intern'];
/* Kiêm nhiệm: mỗi dòng "Vai trò | Ban | Phòng | Ghi chú" */
function parseKN(t){return String(t||'').split(/\n|;/).map(function(l){var a=l.split('|').map(function(x){return x.trim()});return {r:a[0]||'',u1:a[1]||'',u2:a[2]||'',t:a[3]||''}}).filter(function(k){return k.r||k.t})}
function knText(k){return (k.t||k.r)+(k.u2||k.u1?' · '+(k.u2||k.u1):'')}
function pplType(p){if(TYPES.indexOf(p.loai_ns)>=0)return p.loai_ns;var c=String(p.chuc_danh||'').toLowerCase();
  if(/^ctv|cộng tác/.test(c)||p.vai_tro==='Collaborator')return 'Collaborator';if(/^tts|thực tập/.test(c)||p.vai_tro==='Intern')return 'Intern';return 'Staff'}
function pplLevel(c){c=String(c||'').toLowerCase();
  if(/tổng giám đốc|giám đốc|phụ trách ban/.test(c))return 'Executive';
  if(/trưởng phòng/.test(c))return 'Head of dept';
  if(/chuyên gia/.test(c))return 'Expert';
  if(/cao cấp|cvcc/.test(c))return 'Senior specialist';
  if(/chính/.test(c))return 'Specialist';
  if(/^tts|thực tập/.test(c))return 'Intern';
  if(/^ctv|cộng tác/.test(c))return 'Collaborator';
  if(/chuyên viên|^cv|nhân viên/.test(c))return 'Associate';
  return 'Other'}
var LEVELS=['Executive','Head of dept','Expert','Senior specialist','Specialist','Associate','Collaborator','Intern','Other'];
function pplField(c){c=String(c||'').toLowerCase();
  if(/giám đốc|phụ trách ban/.test(c))return 'Management';
  var m=[['Planning',/quy hoạch/],['Structure',/kết cấu/],['MEP & Infrastructure',/hạ tầng|mep|điện|cấp thoát|hvac|pccc/],['Landscape',/cảnh quan/],['Interior',/nội thất/],
    ['QS & Cost',/khối lượng|qs|dự toán|chi phí|thanh quyết|hợp đồng|kinh tế/],['Procurement',/đấu thầu|cung ứng/],['BIM',/bim/],['Architecture',/công trình|kiến trúc/],['Operations',/vận hành/],['HR & Admin',/hcns|nhân sự/]];
  for(var i=0;i<m.length;i++)if(m[i][1].test(c))return m[i][0];
  return 'Other'}
function pplRole(p,nKids){var c=String(p.chuc_danh||'').toLowerCase();
  if(/tổng giám đốc|giám đốc/.test(c))return 'Director';
  if(/phụ trách ban/.test(c))return 'Unit lead';
  if(/trưởng phòng/.test(c))return 'Head of dept';
  if(/^tts|thực tập/.test(c))return 'Intern';
  if(/^ctv|cộng tác/.test(c))return 'Collaborator';
  if(nKids>=2)return 'Discipline lead';
  if(/chuyên gia/.test(c))return 'Expert';
  return 'Member'}
function pplIndex(list){
  var X={list:list,by:{},kids:{},bans:[],banColor:{},deps:{}};
  list.forEach(function(p){if(typeof p.sdt==='number')p.sdt='0'+p.sdt;p.sdt=String(p.sdt||'');X.by[p.ho_ten]=p});
  list.forEach(function(p){var m=p.quan_ly&&X.by[p.quan_ly]&&p.quan_ly!==p.ho_ten?p.quan_ly:'';p._mgr=m;(X.kids[m]=X.kids[m]||[]).push(p)});
  list.forEach(function(p){
    p._lv=pplLevel(p.chuc_danh);p._bm=DISC.indexOf(p.bo_mon)>=0?p.bo_mon:pplField(p.chuc_danh);p._bmAuto=DISC.indexOf(p.bo_mon)<0;
    p._role=ROLES.indexOf(p.vai_tro)>=0?p.vai_tro:pplRole(p,(X.kids[p.ho_ten]||[]).length);p._roleAuto=ROLES.indexOf(p.vai_tro)<0;
    p._kn=parseKN(p.kiem_nhiem);p._type=pplType(p);p._ext=p._type!=='Staff';
    if(p.don_vi_1&&X.bans.indexOf(p.don_vi_1)<0)X.bans.push(p.don_vi_1);
    if(p.don_vi_1){var d=X.deps[p.don_vi_1]=X.deps[p.don_vi_1]||[];if(p.don_vi_2&&d.indexOf(p.don_vi_2)<0)d.push(p.don_vi_2)}});
  var cnt=function(b){return list.filter(function(p){return p.don_vi_1===b}).length};
  X.bans.sort(function(a,b){return cnt(b)-cnt(a)});
  X.bans.forEach(function(b,i){X.banColor[b]=BAN_COLOR[i%BAN_COLOR.length];X.deps[b].sort(function(a,c){return list.filter(function(p){return p.don_vi_2===c}).length-list.filter(function(p){return p.don_vi_2===a}).length})});
  var size=function(n,seen){seen=seen||{};if(seen[n])return 0;seen[n]=1;return (X.kids[n]||[]).reduce(function(s,k){return s+1+size(k.ho_ten,seen)},0)};
  list.forEach(function(p){p._team=size(p.ho_ten)});
  var rk=function(p){return ROLES.indexOf(p._role)};
  Object.keys(X.kids).forEach(function(k){X.kids[k].sort(function(a,b){return rk(a)-rk(b)||(b._team-a._team)||a.ho_ten.localeCompare(b.ho_ten,'vi')})});
  X.issues=pplIssues(X);
  return X}
function pplIssues(X){var out=[],add=function(kind,p,msg){out.push({kind:kind,name:p.ho_ten,msg:msg})};
  X.list.forEach(function(p){
    var m=X.by[p._mgr];
    if(!p.don_vi_1)add('Missing unit',p,'No unit (Ban) recorded');
    else if(!p.don_vi_2&&['Director','Unit lead'].indexOf(p._role)<0)add('Missing department',p,'In '+p.don_vi_1+' but no department');
    if(p.quan_ly&&!X.by[p.quan_ly])add('Manager not in list',p,'Manager "'+p.quan_ly+'" is not in the staff list');
    if(!p.quan_ly&&p._role!=='Director')add('No manager',p,'No direct manager');
    if(m&&m.don_vi_1&&p.don_vi_1&&m.don_vi_1!==p.don_vi_1&&m._role!=='Director')add('Cross-unit line',p,'Unit '+p.don_vi_1+' but manager '+m.ho_ten+' is in '+m.don_vi_1);
    else if(m&&m.don_vi_2&&p.don_vi_2&&m.don_vi_2!==p.don_vi_2&&['Director','Unit lead'].indexOf(m._role)<0)add('Cross-department line',p,p.don_vi_2+' → manager '+m.ho_ten+' ('+m.don_vi_2+'). Fine if this is a discipline (professional) line.');
    if((X.kids[p.ho_ten]||[]).length>=3&&p._roleAuto&&p._role==='Discipline lead')add('Role to confirm',p,'Manages '+(X.kids[p.ho_ten]||[]).length+' people but title is "'+p.chuc_danh+'"');
  });
  X.bans.forEach(function(b){X.deps[b].forEach(function(d){var hs=X.list.filter(function(p){return (p.don_vi_2===d&&p._role==='Head of dept')||p._kn.some(function(k){return k.r==='Head of dept'&&k.u2===d})});
    if(hs.length!==1)out.push({kind:'Department head',name:'',dep:d,msg:d+': '+(hs.length?hs.length+' heads ('+hs.map(function(h){return h.ho_ten}).join(', ')+')':'no head of department')})})});
  return out}
function given(n){var w=String(n||'').trim().split(/\s+/);return w[w.length-1]||''}

    var col=X.banColor[b],lead=mem.filter(function(p){return p._role==='Unit lead'})[0],klead=L.filter(function(p){return p._kn.some(function(k){return k.r==='Unit lead'&&k.u1===b})});

    h+='<li>'+box(b,mem.length,col,'ban')+(lead||klead.length?'<div class="oclead">'+klead.map(function(p){return '<div class="ockn">'+ocCard(p,X,anyF,false,false)+'</div>'}).join('')+(lead?ocCard(lead,X,anyF,ED,false):'')+'</div>':'')+'<ul>'+
      deps.filter(function(d){return !f.u2||d===f.u2}).map(function(d){
        var ps=mem.filter(function(p){return (p.don_vi_2||'')===d&&p!==lead}).sort(function(a,c){return (a._ext-c._ext)||ROLES.indexOf(a._role)-ROLES.indexOf(c._role)||DISC.indexOf(a._bm)-DISC.indexOf(c._bm)});
        var kh=d?L.filter(function(p){return p._kn.some(function(k){return (k.r==='Head of dept'||k.r==='Deputy head')&&k.u2===d})}):[];
        if(!ps.length)return '';
        return '<li>'+box(d||'Directly under unit',ps.length,col,'dep')+'<div class="ocstack">'+kh.map(function(p){return '<div class="ockn">'+ocCard(p,X,anyF,false,false)+'</div>'}).join('')+ps.map(function(p){return ocCard(p,X,anyF,ED,false)}).join('')+'</div></li>'}).join('')+'</ul></li>';
  });
  var none=L.filter(function(p){return !p.don_vi_1&&p!==root});
  if(none.length&&!f.u1)h+='<li>'+box('Unit not recorded',none.length,'#9AA5B5','ban')+'<ul><li><div class="ocstack">'+none.map(function(p){return ocCard(p,X,anyF,ED,false)}).join('')+'</div></li></ul></li>';
  return h+'</ul></li></ul>'}
function chartHtml(X,anyF,ED,f){
  S.cOpen=S.cOpen||{};var mode=f.cm||'lines';
  var body=mode==='units'?ocUnits(X,anyF,ED,f):'<ul class="oc">'+(X.kids['']||[]).map(function(r){return ocBranch(r,X,anyF,ED)}).join('')+'</ul>';
  return '<section class="panel ocwrap"><div class="hd"><div class="seg" id="cm">'+[['lines','Reporting lines'],['units','By unit']].map(function(x){return '<button data-m="'+x[0]+'" class="'+(mode===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div><span class="sp"></span>'+
    '<div class="seg"><button id="czo" title="Zoom out">−</button><button id="czf">Fit</button><button id="czi" title="Zoom in">+</button></div>'+(mode==='lines'?'<button class="btn sm" id="cAll">Expand all</button>':'')+'<button class="btn sm" id="cPrint">Print / PDF</button></div>'+
    '<div class="ocscroll" id="ocs"><div class="ocz" id="ocz">'+body+'</div></div></section>'+
    '<div class="pleg">'+X.bans.map(function(b){return '<span><i style="background:'+X.banColor[b]+'"></i>'+esc(b)+'</span>'}).join('')+'</div>'}
function bindChart(v,X){
  var z=document.getElementById('ocz'),sc=document.getElementById('ocs');if(!z)return;
  var setZ=function(k){S.cz=Math.max(.3,Math.min(1.4,k));z.style.zoom=S.cz};
  var fit=function(){z.style.zoom=1;var w=z.scrollWidth;setZ(w?Math.min(1,(sc.clientWidth-8)/w):1)};
  if(S.cz)setZ(S.cz);else fit();
  sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;
  document.getElementById('czo').onclick=function(){setZ((S.cz||1)-.1)};
  document.getElementById('czi').onclick=function(){setZ((S.cz||1)+.1)};
  document.getElementById('czf').onclick=fit;
  v.querySelectorAll('#cm button').forEach(function(b){b.onclick=function(){S.pf.cm=b.dataset.m;S.cz=0;render()}});
  var ca=document.getElementById('cAll');if(ca)ca.onclick=function(){S.cOpen={};S.cz=0;render()};
  document.getElementById('cPrint').onclick=function(){window.print()};
  v.querySelectorAll('.octg').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();S.cOpen[b.dataset.ctg]=b.dataset.open!=='1';render()}});
  /* kéo để cuộn ngang/dọc khi không ở chế độ sửa */
  if(!adm()){var down=null;sc.onmousedown=function(e){if(e.target.closest('.occ,button'))return;down={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:window.scrollY};sc.classList.add('pan')};
    window.onmousemove=function(e){if(!down)return;sc.scrollLeft=down.l-(e.clientX-down.x);window.scrollTo(0,down.t-(e.clientY-down.y))};
    window.onmouseup=function(){down=null;sc.classList.remove('pan')}}
}

/* ================= TRA CỨU ================= */
var SQ={q:'',pj:'',who:'',vm:''};
function vSearch(v){
  var html='<div class="row" style="justify-content:space-between"><h1>Search</h1></div><div class="filters">'+
    '<input type="search" id="sq" placeholder="Từ khóa, ví dụ PCCC, thanh toán, thẩm định" value="'+esc(SQ.q)+'" style="flex:1;min-width:220px">'+
    '<select id="spj"><option value="">Mọi dự án</option>'+S.data.DuAn.map(function(p){return '<option value="'+p.ma+'"'+(SQ.pj===p.ma?' selected':'')+'>'+esc(p.ten)+'</option>'}).join('')+'</select>'+
    '<select id="swho"><option value="">Mọi người</option>'+IX.people.map(function(p){return '<option'+(SQ.who===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'+
    '<select id="svm"><option value="">Mọi loại</option><option value="*"'+(SQ.vm==='*'?' selected':'')+'>Chỉ vướng mắc</option>'+S.data.DanhMuc.loai_vm.map(function(x){return '<option'+(SQ.vm===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'<option value="ra"'+(SQ.vm==='ra'?' selected':'')+'>Chờ rà</option></select></div><div id="sres"></div>';
  v.innerHTML=html;
  var run=function(){
    var q=SQ.q.trim().toLowerCase();
    var r=S.data.BaoCaoTuan.filter(function(n){
      if(SQ.pj&&n.ma_da!==SQ.pj)return false;
      if(SQ.who&&n.nguoi_nhap!==SQ.who)return false;
      if(SQ.vm==='*'&&!(n.loai==='Vướng mắc'||n.loai_vm))return false;
      if(SQ.vm==='ra'&&n.tinh_trang!=='Chờ rà')return false;
      if(SQ.vm&&SQ.vm!=='*'&&SQ.vm!=='ra'&&n.loai_vm!==SQ.vm)return false;
      return !q||String(n.noi_dung).toLowerCase().indexOf(q)>=0;
    }).sort(function(a,b){return a.tuan<b.tuan?1:-1});
    var pjs={};r.forEach(function(n){pjs[n.ma_da]=1});
    document.getElementById('sres').innerHTML=(S.oldLoaded?'':'<div class="hint">Đang tải ghi chú trước '+dmy(S.data.tu_tuan)+'… kết quả sẽ tự bổ sung.</div>')+'<section class="panel"><div class="hd"><h2>'+r.length+' ghi chú</h2><span class="muted" style="font-size:12px">ở '+Object.keys(pjs).length+' dự án'+(r.length>200?' · hiện 200 ghi chú mới nhất':'')+'</span></div><div class="bd">'+(r.length?'<div class="list">'+r.slice(0,200).map(function(n){return noteLi(n,SQ.q.trim())}).join('')+'</div>':'<div class="empty">Không có ghi chú khớp.</div>')+'</div></section>';
    bindNoteLinks(document.getElementById('sres'));
  };
  var t;document.getElementById('sq').oninput=function(){SQ.q=this.value;clearTimeout(t);t=setTimeout(run,200)};
  document.getElementById('spj').onchange=function(){SQ.pj=this.value;run()};
  document.getElementById('swho').onchange=function(){SQ.who=this.value;run()};
  document.getElementById('svm').onchange=function(){SQ.vm=this.value;run()};
  run();
}
