<title>Quản lý Dự án Stellar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese">
<style>
/* Bố cục: thanh trên cố định (tuần + người dùng), tab chức năng, vùng nội dung rộng tối đa 1280px; chi tiết hạng mục mở ngăn kéo bên phải */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#142131; --muted:#5A6A7C; --line:#D9E0E8;
  --accent:#0F5B8A; --accent-soft:#E2EDF6; --accent-ink:#FFFFFF;
  --good:#2E7D4F; --good-soft:#E3F2E8; --warn:#A86A12; --warn-soft:#FBF0DC; --crit:#BF3B2E; --crit-soft:#FBE6E3; --idle:#7F8A96; --idle-soft:#ECEFF2;
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,33,49,.06),0 4px 16px rgba(20,33,49,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151D; --surface:#15202B; --sunk:#1B2835; --ink:#E5ECF2; --muted:#98A8B8; --line:#273545;
  --accent:#5BA8DC; --accent-soft:#163149; --accent-ink:#0B1520;
  --good:#53B47F; --good-soft:#15301F; --warn:#E0A63E; --warn-soft:#33270F; --crit:#E86C5E; --crit-soft:#3A1A17; --idle:#7E8B98; --idle-soft:#212D39;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#15202B; --sunk:#1B2835; --ink:#E5ECF2; --muted:#98A8B8; --line:#273545;
  --accent:#5BA8DC; --accent-soft:#163149; --accent-ink:#0B1520;
  --good:#53B47F; --good-soft:#15301F; --warn:#E0A63E; --warn-soft:#33270F; --crit:#E86C5E; --crit-soft:#3A1A17; --idle:#7E8B98; --idle-soft:#212D39;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand{align-items:center}
.logo{height:26px;width:auto;display:block}
.logo.big{height:40px}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.week{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:3px}
.week button{border:0;background:transparent;width:30px;height:30px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:16px}
.week button:hover{background:var(--surface);color:var(--ink)}
.week .lbl{padding:0 8px;font-weight:600;font-size:13px;white-space:nowrap}
.week .lbl small{font-weight:400;color:var(--muted);margin-left:6px}
.user{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:500;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;padding-block:6px;border-bottom:1px solid var(--line)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.hd .sp{margin-left:auto}
.panel>.bd{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:700;font-family:var(--f-mono);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td{font-size:inherit}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.c,th.c{text-align:center}
.grp td{background:var(--sunk);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sym{font-size:15px;line-height:1;display:inline-block;width:22px;text-align:center}
.sym.done{color:var(--good)} .sym.run{color:var(--accent)} .sym.part{color:var(--warn)} .sym.none{color:var(--line)}
.rag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.rag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.rag.Xanh{color:var(--good);background:var(--good-soft)} .rag.Vàng{color:var(--warn);background:var(--warn-soft)}
.rag.Đỏ{color:var(--crit);background:var(--crit-soft)} .rag.Xám{color:var(--idle);background:var(--idle-soft)}
.st{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;background:var(--sunk);white-space:nowrap}
.st.ok{background:var(--good-soft);color:var(--good)} .st.run{background:var(--accent-soft);color:var(--accent)}
.st.wait{background:var(--warn-soft);color:var(--warn)} .st.stop{background:var(--idle-soft);color:var(--idle)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--crit-soft);color:var(--crit)}
.tag.ra{background:var(--warn-soft);color:var(--warn)}
.prog{display:flex;align-items:center;gap:6px;min-width:90px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.prog span{font-size:12px;font-family:var(--f-mono);color:var(--muted);width:34px;text-align:right}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:72px}
.li .body{min-width:0;flex:1}
.li .body .t{white-space:pre-wrap;word-break:break-word}
.li .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=search],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;font-size:13px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.45}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.phead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.phead .info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.moc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.moc div{background:var(--sunk);border-radius:var(--r);padding:8px 10px}
.moc div b{display:block;font-family:var(--f-mono);font-size:14px}
.moc div.past b{color:var(--muted)}
.moc div.soon{background:var(--warn-soft)}
details.grp2{border-top:1px solid var(--line)}
details.grp2>summary{list-style:none;cursor:pointer;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.grp2>summary::-webkit-details-marker{display:none}
details.grp2>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.grp2[open]>summary::before{transform:rotate(90deg)}
details.grp2>summary .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:28px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,18,28,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .dh .x{margin-left:auto}
.drawer .db{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.card .top2{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.card .top2 .nm{font-weight:600;flex:1;min-width:200px}
.hint{font-size:12px;background:var(--sunk);border-radius:6px;padding:6px 9px;white-space:pre-wrap;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:640px){h1{font-size:19px}.kpi .v{font-size:22px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="root"><div class="loading">Đang tải dữ liệu…</div></div>

<script>
(function(){
'use strict';
/* ================= KẾT NỐI ================= */
/* LOGO: dán chuỗi data:image/png;base64,... (hoặc svg) vào giữa hai dấu nháy. Để trống thì không hiện logo. */
var LOGO = '';
var APP_NAME = 'Quản lý Dự án Stellar';
function logoHtml(big){return LOGO?'<img class="logo'+(big?' big':'')+'" src="'+LOGO+'" alt="Stellar">':''}
var LIVE = typeof google !== 'undefined' && google.script && google.script.run;
var DEMO = window.DEMO_DATA || null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function call(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e&&e.message?e:new Error(String(e)))});r[fn].apply(r,a)})}
var api = LIVE ? {
  people:function(){return call('api_people')},
  login:function(t,c){return call('api_login',t,c)},
  load:function(){return call('api_load',S.token)},
  addNote:function(n){return call('api_addNote',S.token,n)},
  updateNote:function(p){return call('api_updateNote',S.token,p)},
  updateTask:function(p){return call('api_updateTask',S.token,p)},
  setReview:function(p){return call('api_setReview',S.token,p)},
  logout:function(){return call('api_logout',S.token)}
} : {
  people:function(){return Promise.resolve(DEMO.NhanSu.filter(function(p){return p.kich_hoat==='Có'&&p.ten.charAt(0)!=='('}))},
  login:function(t){var p=DEMO.NhanSu.filter(function(x){return x.ten===t})[0];return Promise.resolve({token:'demo',ten:p.ten,vai_tro:p.vai_tro})},
  load:function(){var d=JSON.parse(JSON.stringify(DEMO));d.user=S.user;return Promise.resolve(d)},
  addNote:function(n){var r=Object.assign({id:'D'+Date.now(),nguoi_nhap:S.user.ten,thoi_diem:new Date().toISOString().slice(0,19),nguon:'Web',tinh_trang:'Nhập tay',ghi_chu_ra:''},n);if(n.loai!=='Vướng mắc')r.loai_vm='';return Promise.resolve(r)},
  updateNote:function(p){var c=Object.assign({},p);delete c.id;return Promise.resolve(c)},
  updateTask:function(p){var c=Object.assign({},p);delete c.id;if(c.tien_do!==undefined&&c.tien_do!==''){c.tien_do=Number(c.tien_do);if(c.tien_do>1)c.tien_do/=100}return Promise.resolve(c)},
  setReview:function(p){return Promise.resolve(Object.assign({},p,{nguoi_duyet:S.user.ten,thoi_diem:new Date().toISOString().slice(0,19)}))},
  logout:function(){return Promise.resolve(true)}
};

/* ================= TIỆN ÍCH ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function D(iso){if(!iso)return null;var p=String(iso).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function add(isoS,n){var d=D(isoS);d.setDate(d.getDate()+n);return iso(d)}
function mon(isoS){var d=D(isoS);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function dm(isoS){if(!isoS)return '';var d=D(isoS);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)}
function dmy(isoS){if(!isoS)return '';var d=D(isoS);return dm(isoS)+'/'+d.getFullYear()}
function weekNo(isoS){var d=D(isoS);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function days(a,b){return Math.round((D(b)-D(a))/864e5)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function err(e){var m=(e&&e.message)||String(e);if(m.indexOf('PHIEN_HET_HAN')>=0){logoutLocal();toast('Phiên đăng nhập đã hết, mời đăng nhập lại.');return}toast(m)}
function pct(v){return v===''||v==null?'':Math.round(Number(v)*100)}
function hl(text,q){var t=esc(text);if(typeof q!=='string'||!q)return t;var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return t.replace(re,'<mark>$1</mark>')}
function short(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}

/* ================= TRẠNG THÁI ================= */
var S={token:store('qltk_tok'),user:null,data:null,week:null,view:'tong-quan',pj:null,luong:'',q:'',person:null,myFilter:'dang',drawer:null};
try{var u=store('qltk_user');if(u)S.user=JSON.parse(u)}catch(e){}
var IX={};
var STAGES=['Pháp lý/QH','Concept','MKT','Thỏa thuận','BCNCKT/TKCS','CPXD','TKKT/BVTC'];
var DONE=['Hoàn thành','Không thực hiện'];
var RUN=['Đang triển khai','Chờ CĐT/phòng ban','Chờ thẩm tra/thẩm định'];

function stageOf(t){
  var g=(t.ten_nhom||'').toUpperCase(), n=(t.ten||'').toUpperCase();
  if(t.cap==='moc')return null;
  if(/CONCEPT/.test(g)||((/CTĐT|PHÁP LÝ|NHÀ ĐẦU TƯ/.test(g))&&/CONCEPT|PHÊ DUYỆT TK/.test(n)))return 'Concept';
  if(/CTĐT|PHÁP LÝ|QUY HOẠCH|NHÀ ĐẦU TƯ/.test(g))return 'Pháp lý/QH';
  if(/MKT/.test(g))return 'MKT';
  if(/THỎA THUẬN/.test(g))return 'Thỏa thuận';
  if(/BCNCKT/.test(g))return 'BCNCKT/TKCS';
  if(/CPXD/.test(g))return 'CPXD';
  if(/TKKT|TKBVTC|MỜI THẦU TCXL/.test(g))return 'TKKT/BVTC';
  return null;
}
function tStatus(t){
  if(t.trang_thai)return t.trang_thai;
  var v=t.tien_do;if(v===''||v==null)return '';v=Number(v);
  return v>=.999?'Hoàn thành':(v<=0?'Chưa bắt đầu':'Đang triển khai');
}
function stCls(s){return DONE.indexOf(s)>=0?'ok':(s==='Đang triển khai'?'run':(RUN.indexOf(s)>=0?'wait':(s==='Tạm dừng'?'stop':'')))}

function index(){
  var d=S.data;IX={pj:{},task:{},tasksBy:{},notesByTask:{},notesByPj:{},review:{},moc:{}};
  d.DuAn.forEach(function(p){IX.pj[p.ma]=p;IX.tasksBy[p.ma]=[];IX.notesByPj[p.ma]=[];IX.moc[p.ma]=[]});
  d.CongViec.forEach(function(t){IX.task[t.id]=t;t._stage=stageOf(t);(IX.tasksBy[t.ma_da]||(IX.tasksBy[t.ma_da]=[])).push(t)});
  d.BaoCaoTuan.forEach(function(n){(IX.notesByTask[n.cv_id]||(IX.notesByTask[n.cv_id]=[])).push(n);(IX.notesByPj[n.ma_da]||(IX.notesByPj[n.ma_da]=[])).push(n)});
  d.DanhGiaTuan.forEach(function(r){IX.review[r.ma_da+'|'+r.tuan]=r});
  d.MocCDT.forEach(function(m){(IX.moc[m.ma_da]||(IX.moc[m.ma_da]=[])).push(m)});
  var pp={};d.CongViec.forEach(function(t){if(t.nguoi_pt)pp[t.nguoi_pt]=1});
  IX.people=Object.keys(pp).sort(function(a,b){return a.localeCompare(b,'vi')});
}
function notesIn(list,from,to){return list.filter(function(n){return n.tuan>=from&&n.tuan<=to})}

function stageSym(p){
  var res={},w=S.week,from=add(w,-21);
  STAGES.forEach(function(s){res[s]='none'});
  var by={};STAGES.forEach(function(s){by[s]=[]});
  IX.tasksBy[p.ma].forEach(function(t){if(t._stage&&t.cap==='hangmuc')by[t._stage].push(t)});
  STAGES.forEach(function(s){
    var items=by[s],cons=0,done=0,run=0,recent=0;
    items.forEach(function(t){
      var st=tStatus(t),ns=notesIn(IX.notesByTask[t.id]||[],from,w).length;
      if(st||ns){cons++}
      if(DONE.indexOf(st)>=0)done++;
      else if(RUN.indexOf(st)>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1))run++;
      if(ns)recent++;
    });
    if(!cons)res[s]='none';else if(done===cons)res[s]='done';else if(run||recent)res[s]='run';else if(done)res[s]='part';else res[s]='none';
  });
  return res;
}
function health(p){
  var w=S.week,rev=IX.review[p.ma+'|'+w];
  if(p.trang_thai==='Tạm dừng'||p.trang_thai==='Chuẩn bị'||p.trang_thai==='Kết thúc')return {rag:rev&&rev.rag||'Xám',auto:'Xám',why:[p.trang_thai],rev:rev};
  var from=add(w,-21),overdue=[],soon=[],why=[];
  IX.tasksBy[p.ma].forEach(function(t){
    if(t.cap!=='hangmuc'||!t.deadline_cdt)return;
    var st=tStatus(t);if(DONE.indexOf(st)>=0)return;
    var active=RUN.indexOf(st)>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1)||notesIn(IX.notesByTask[t.id]||[],from,w).length;
    if(t.deadline_cdt<w&&active)overdue.push(t);
    else if(t.deadline_cdt>=w&&t.deadline_cdt<=add(w,14))soon.push(t);
  });
  var vm=notesIn(IX.notesByPj[p.ma],add(w,-7),w).filter(function(n){return n.loai==='Vướng mắc'||n.loai_vm});
  var auto='Xanh';
  if(overdue.length){auto='Đỏ';why.push(overdue.length+' hạng mục đang làm đã quá deadline CĐT')}
  if(soon.length){if(auto==='Xanh')auto='Vàng';why.push(soon.length+' hạng mục đến hạn trong 14 ngày')}
  if(vm.length){if(auto==='Xanh')auto='Vàng';why.push(vm.length+' ghi chú vướng mắc trong 2 tuần')}
  if(!why.length)why.push('Không có hạng mục quá hạn hoặc vướng mắc mới');
  return {rag:rev&&rev.rag||auto,auto:auto,why:why,overdue:overdue,soon:soon,rev:rev};
}

    '<label>Trạng thái<select id="f_trang_thai"'+(ed?'':' disabled')+'>'+opt(dmL.trang_thai_hm,t.trang_thai)+'</select></label>'+
    '<label class="full">Vướng mắc (đang tồn tại)<textarea id="f_vuong_mac" rows="2"'+(ed?'':' disabled')+'>'+esc(t.vuong_mac)+'</textarea></label>'+
    '<label class="full">Ghi chú / văn bản đầu ra<input type="text" id="f_ghi_chu" value="'+esc(t.ghi_chu)+'"'+(ed?'':' disabled')+'></label>'+
   '</div>'+
   (ed?'<div class="row"><button class="btn pri sm" id="saveTask">Lưu thông tin hạng mục</button>'+(canReview()&&t.can_ra?'<button class="btn sm" id="clearRa">Đánh dấu đã rà</button>':'')+'</div>':'<div class="muted" style="font-size:12px">Chỉ người phụ trách hoặc người duyệt sửa được thông tin hạng mục.</div>')+
   (S.user?'<div class="panel" style="border-style:dashed"><div class="bd" style="display:flex;flex-direction:column;gap:8px"><h3>Thêm ghi chú tuần '+weekNo(S.week)+' ('+dm(S.week)+')</h3>'+
     '<div class="row"><select id="n_loai">'+dmL.loai_bc.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select><select id="n_vm" hidden>'+dmL.loai_vm.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div>'+

    if(pl.tien_do===1&&!pl.trang_thai)pl.trang_thai='Hoàn thành';
    sv.disabled=true;
    api.updateTask(pl).then(function(ch){Object.assign(t,ch);index();toast(Object.keys(ch).length?'Đã lưu hạng mục':'Không có gì thay đổi');render()}).catch(function(e){sv.disabled=false;err(e)});
  };
  var cr=document.getElementById('clearRa');if(cr)cr.onclick=function(){api.updateTask({id:id,can_ra:''}).then(function(ch){Object.assign(t,ch);index();render()}).catch(err)};
  var an=document.getElementById('addNote');
  if(an)an.onclick=function(){
    var txt=document.getElementById('n_txt').value.trim();if(!txt){toast('Nhập nội dung ghi chú');return}
    an.disabled=true;
    api.addNote({ma_da:t.ma_da,cv_id:id,tuan:S.week,loai:lo.value,loai_vm:lo.value==='Vướng mắc'?document.getElementById('n_vm').value:'',noi_dung:txt})
      .then(function(r){S.data.BaoCaoTuan.push(r);index();toast('Đã lưu ghi chú');render()}).catch(function(e){an.disabled=false;err(e)});
  };

function markRa(nid){var n=S.data.BaoCaoTuan.filter(function(x){return x.id===nid})[0];api.updateNote({id:nid,tinh_trang:'Đã rà'}).then(function(ch){Object.assign(n,ch);index();toast('Đã đánh dấu đã rà');render()}).catch(err)}

/* ================= BÁO CÁO TUẦN (VIỆC CỦA TÔI) ================= */
function vMine(v){
  var w=S.week,from=add(w,-56);
  if(!S.person||IX.people.indexOf(S.person)<0)S.person=IX.people.indexOf(S.user.ten)>=0?S.user.ten:IX.people[0];
  var person=S.person;
  var mine=S.data.CongViec.filter(function(t){return t.nguoi_pt===person&&t.cap!=='moc'&&IX.pj[t.ma_da]&&IX.pj[t.ma_da].trang_thai!=='Kết thúc'});
  var list=mine.filter(function(t){
    var st=tStatus(t),ns=IX.notesByTask[t.id]||[];
    if(S.myFilter==='tat-ca')return true;
    if(S.myFilter==='tuan-nay')return ns.some(function(n){return n.tuan===w});
    return RUN.indexOf(st)>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1)||ns.some(function(n){return n.tuan>=from&&n.tuan<=add(w,7)});
  });
  var by={};list.forEach(function(t){(by[t.ma_da]=by[t.ma_da]||[]).push(t)});
  var done=list.filter(function(t){return (IX.notesByTask[t.id]||[]).some(function(n){return n.tuan===w})}).length;
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tuần '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Báo cáo tuần</h1></div>'+
   '<div class="filters"><label class="muted" style="font-size:12px">Người <select id="mp">'+IX.people.map(function(p){return '<option'+(p===person?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></label>'+
   '<div class="seg" id="mf">'+[['dang','Đang làm'],['tuan-nay','Có ghi chú tuần này'],['tat-ca','Tất cả']].map(function(x){return '<button data-f="'+x[0]+'" class="'+(S.myFilter===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div></div>';
  html+='<div class="muted" style="font-size:13px">'+esc(person)+' phụ trách '+mine.length+' hạng mục ở '+Object.keys(mine.reduce(function(a,t){a[t.ma_da]=1;return a},{})).length+' dự án. Đang hiện '+list.length+' hạng mục, '+done+' đã có ghi chú tuần này.'+(person!==S.user.ten&&!canReview()?' Bạn chỉ xem được, không ghi thay người khác.':'')+'</div>';
  if(!list.length)html+='<div class="panel"><div class="empty">Không có hạng mục nào theo bộ lọc này. Chọn "Tất cả" để xem toàn bộ hạng mục được giao.</div></div>';
  Object.keys(by).sort().forEach(function(ma){
    var p=IX.pj[ma];
    html+='<section class="panel"><div class="hd"><h2>'+esc(p.ten)+'</h2><span class="chip">'+p.luong+'</span>'+(p.trang_thai!=='Đang chạy'?'<span class="st stop">'+esc(p.trang_thai)+'</span>':'')+'<a class="sp" data-pj="'+ma+'" style="color:var(--accent);cursor:pointer;font-size:13px">Mở dự án ›</a></div><div class="bd" style="display:flex;flex-direction:column;gap:10px">';
    by[ma].forEach(function(t){
      var ns=IX.notesByTask[t.id]||[],plan=ns.filter(function(n){return n.tuan===add(w,-7)}),now=ns.filter(function(n){return n.tuan===w}),st=tStatus(t);
      var can=S.user.ten===person||canReview();
      html+='<div class="card"><div class="top2"><div class="nm">'+esc(t.cap==='nhom'?'Ghi chung nhóm '+t.nhom+': '+t.ten_nhom:t.ten)+'<div class="muted" style="font-size:12px;font-weight:400">Nhóm '+esc(t.nhom)+(t.deadline_cdt?' · Deadline CĐT <span class="mono">'+dmy(t.deadline_cdt)+'</span>':'')+'</div></div>'+(st?'<span class="st '+stCls(st)+'">'+esc(st)+'</span>':'')+progHtml(t.tien_do)+'<button class="btn sm" data-open="'+t.id+'">Chi tiết</button></div>'+
        (plan.length?'<div class="hint"><b>Tuần trước ('+dm(add(w,-7))+'):</b> '+esc(plan.map(function(n){return n.noi_dung}).join('\n'))+'</div>':'')+
        now.map(function(n){return '<div class="hint" style="background:var(--accent-soft);color:var(--ink)"><b>'+esc(n.loai)+':</b> '+esc(n.noi_dung)+'</div>'}).join('')+
        (can?'<div class="row"><select data-l="'+t.id+'">'+S.data.DanhMuc.loai_bc.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select><select data-vm="'+t.id+'" hidden>'+S.data.DanhMuc.loai_vm.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div><textarea data-tx="'+t.id+'" rows="2" placeholder="Ghi nhanh cho tuần '+weekNo(w)+'…"></textarea><div class="row"><button class="btn pri sm" data-save="'+t.id+'">Lưu</button></div>':'')+
        '</div>';
    });
    html+='</div></section>';
  });
  v.innerHTML=html;
  document.getElementById('mp').onchange=function(){S.person=this.value;render()};
  document.querySelectorAll('#mf button').forEach(function(b){b.onclick=function(){S.myFilter=b.dataset.f;render()}});
  v.querySelectorAll('a[data-pj]').forEach(function(a){a.onclick=function(){go('du-an',a.dataset.pj)}});
  v.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openTask(b.dataset.open)}});
  v.querySelectorAll('select[data-l]').forEach(function(s){s.onchange=function(){v.querySelector('select[data-vm="'+s.dataset.l+'"]').hidden=s.value!=='Vướng mắc'}});
  v.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.save,t=IX.task[id],tx=v.querySelector('textarea[data-tx="'+id+'"]').value.trim(),lo=v.querySelector('select[data-l="'+id+'"]').value;
    if(!tx){toast('Nhập nội dung ghi chú');return}
    b.disabled=true;
    api.addNote({ma_da:t.ma_da,cv_id:id,tuan:S.week,loai:lo,loai_vm:lo==='Vướng mắc'?v.querySelector('select[data-vm="'+id+'"]').value:'',noi_dung:tx})
      .then(function(r){S.data.BaoCaoTuan.push(r);index();toast('Đã lưu ghi chú');render()}).catch(function(e){b.disabled=false;err(e)});
  }});
}

/* ================= DUYỆT TUẦN ================= */
function vWeek(v){
  var w=S.week,ps=projects();
  var notes=S.data.BaoCaoTuan.filter(function(n){return n.tuan===w});
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tuần '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Duyệt tuần</h1></div>'+luongSeg()+'</div>';
  html+='<div class="muted" style="font-size:13px">'+notes.length+' ghi chú trong tuần. '+(canReview()?'Chọn RAG, ghi thành quả và điểm nóng cho từng dự án rồi bấm Chốt.':'Chỉ người duyệt chốt được đánh giá tuần.')+'</div>';
  ps.filter(function(p){return p.trang_thai==='Đang chạy'||notes.some(function(n){return n.ma_da===p.ma})}).forEach(function(p){
    var ns=notes.filter(function(n){return n.ma_da===p.ma}),h=health(p),r=h.rev||{};
    html+='<section class="panel"><div class="hd"><h2>'+esc(p.ten)+'</h2><span class="chip">'+p.luong+'</span><span class="rag '+h.rag+'">'+h.rag+'</span>'+(r.nguoi_duyet?'<span class="muted" style="font-size:12px">đã chốt bởi '+esc(r.nguoi_duyet)+'</span>':'<span class="muted" style="font-size:12px">gợi ý: '+h.auto+' · '+esc(h.why.join('; '))+'</span>')+'<span class="sp muted" style="font-size:12px">'+ns.length+' ghi chú</span></div><div class="bd" style="display:flex;flex-direction:column;gap:12px">'+
      (ns.length?'<div class="list">'+ns.map(function(n){return noteLi(n)}).join('')+'</div>':'<div class="muted">Chưa có ghi chú tuần này.</div>')+
      (canReview()?'<div class="form"><label>RAG<select data-rg="'+p.ma+'">'+['','Xanh','Vàng','Đỏ','Xám'].map(function(x){return '<option'+((r.rag||'')===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label>'+
        '<label>Giai đoạn trọng tâm<select data-gd="'+p.ma+'"><option></option>'+S.data.DanhMuc.giai_doan.map(function(x){return '<option'+(r.giai_doan===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label>'+
        '<label class="full">Thành quả nổi bật<input type="text" data-tq="'+p.ma+'" value="'+esc(r.thanh_qua)+'"></label><label class="full">Điểm nóng<input type="text" data-dn="'+p.ma+'" value="'+esc(r.diem_nong)+'"></label></div>'+
        '<div class="row"><button class="btn pri sm" data-rv="'+p.ma+'">Chốt đánh giá tuần</button>'+(ns.some(function(n){return n.tinh_trang==='Chờ rà'})?'<button class="btn sm" data-raall="'+p.ma+'">Đánh dấu đã rà cả tuần</button>':'')+'</div>':
        (r.thanh_qua||r.diem_nong?'<div class="hint">'+(r.thanh_qua?'Thành quả: '+esc(r.thanh_qua)+'\n':'')+(r.diem_nong?'Điểm nóng: '+esc(r.diem_nong):'')+'</div>':''))+
      '</div></section>';
  });
  v.innerHTML=html;bindLuong();bindNoteLinks(v);
  v.querySelectorAll('[data-rv]').forEach(function(b){b.onclick=function(){
    var ma=b.dataset.rv,q=function(a){return v.querySelector('['+a+'="'+ma+'"]').value};
    b.disabled=true;
    api.setReview({ma_da:ma,tuan:S.week,rag:q('data-rg'),giai_doan:q('data-gd'),thanh_qua:q('data-tq'),diem_nong:q('data-dn')})
      .then(function(r){S.data.DanhGiaTuan=S.data.DanhGiaTuan.filter(function(x){return !(x.ma_da===ma&&x.tuan===S.week)});S.data.DanhGiaTuan.push(r);index();toast('Đã chốt đánh giá '+pjName(ma));render()}).catch(function(e){b.disabled=false;err(e)});
  }});
  v.querySelectorAll('[data-raall]').forEach(function(b){b.onclick=function(){
    var ns=S.data.BaoCaoTuan.filter(function(n){return n.ma_da===b.dataset.raall&&n.tuan===S.week&&n.tinh_trang==='Chờ rà'});b.disabled=true;
    Promise.all(ns.map(function(n){return api.updateNote({id:n.id,tinh_trang:'Đã rà'}).then(function(ch){Object.assign(n,ch)})})).then(function(){index();toast('Đã rà '+ns.length+' ghi chú');render()}).catch(err);
  }});
}

/* ================= TRA CỨU ================= */
var SQ={q:'',pj:'',who:'',vm:''};
function vSearch(v){
  var html='<div class="row" style="justify-content:space-between"><h1>Tra cứu ghi chú</h1></div><div class="filters">'+
    '<input type="search" id="sq" placeholder="Từ khóa, ví dụ PCCC, thanh toán, thẩm định" value="'+esc(SQ.q)+'" style="flex:1;min-width:220px">'+
    '<select id="spj"><option value="">Mọi dự án</option>'+S.data.DuAn.map(function(p){return '<option value="'+p.ma+'"'+(SQ.pj===p.ma?' selected':'')+'>'+esc(p.ten)+'</option>'}).join('')+'</select>'+
    '<select id="swho"><option value="">Mọi người</option>'+IX.people.map(function(p){return '<option'+(SQ.who===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'+
    '<select id="svm"><option value="">Mọi loại</option><option value="*"'+(SQ.vm==='*'?' selected':'')+'>Chỉ vướng mắc</option>'+S.data.DanhMuc.loai_vm.map(function(x){return '<option'+(SQ.vm===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'<option value="ra"'+(SQ.vm==='ra'?' selected':'')+'>Chờ rà</option></select></div><div id="sres"></div>';
  v.innerHTML=html;
  var run=function(){
    var q=SQ.q.trim().toLowerCase();
    var r=S.data.BaoCaoTuan.filter(function(n){
      if(SQ.pj&&n.ma_da!==SQ.pj)return false;
      if(SQ.who&&n.nguoi_nhap!==SQ.who)return false;
      if(SQ.vm==='*'&&!(n.loai==='Vướng mắc'||n.loai_vm))return false;
      if(SQ.vm==='ra'&&n.tinh_trang!=='Chờ rà')return false;
      if(SQ.vm&&SQ.vm!=='*'&&SQ.vm!=='ra'&&n.loai_vm!==SQ.vm)return false;
      return !q||String(n.noi_dung).toLowerCase().indexOf(q)>=0;
    }).sort(function(a,b){return a.tuan<b.tuan?1:-1});
    var pjs={};r.forEach(function(n){pjs[n.ma_da]=1});
    document.getElementById('sres').innerHTML='<section class="panel"><div class="hd"><h2>'+r.length+' ghi chú</h2><span class="muted" style="font-size:12px">ở '+Object.keys(pjs).length+' dự án'+(r.length>200?' · hiện 200 ghi chú mới nhất':'')+'</span></div><div class="bd">'+(r.length?'<div class="list">'+r.slice(0,200).map(function(n){return noteLi(n,SQ.q.trim())}).join('')+'</div>':'<div class="empty">Không có ghi chú khớp.</div>')+'</div></section>';
    bindNoteLinks(document.getElementById('sres'));
  };
  var t;document.getElementById('sq').oninput=function(){SQ.q=this.value;clearTimeout(t);t=setTimeout(run,200)};
  document.getElementById('spj').onchange=function(){SQ.pj=this.value;run()};
  document.getElementById('swho').onchange=function(){SQ.who=this.value;run()};
  document.getElementById('svm').onchange=function(){SQ.vm=this.value;run()};
  run();
}

/* ================= CHƯA CẬP NHẬT ================= */
function vMissing(v){
  var w=S.week,ps=projects().filter(function(p){return p.trang_thai==='Đang chạy'});
  var rows=[];
  IX.people.forEach(function(person){
    ps.forEach(function(p){
      var ts=IX.tasksBy[p.ma].filter(function(t){return t.nguoi_pt===person&&t.cap!=='moc'});
      if(!ts.length)return;
      var active=ts.filter(function(t){return RUN.indexOf(tStatus(t))>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1)||(IX.notesByTask[t.id]||[]).some(function(n){return n.tuan>=add(w,-28)&&n.tuan<w})});
      if(!active.length)return;
      var upd=active.filter(function(t){return (IX.notesByTask[t.id]||[]).some(function(n){return n.tuan===w})});
      rows.push({person:person,p:p,active:active,upd:upd});
    });
  });
  var miss=rows.filter(function(r){return r.upd.length<r.active.length});
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tuần '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Chưa cập nhật</h1></div>'+luongSeg()+'</div>'+
   '<div class="muted" style="font-size:13px">Tính trên hạng mục "đang làm" của dự án đang chạy: có trạng thái đang làm/chờ, tiến độ dở dang, hoặc có ghi chú trong 4 tuần trước. '+rows.length+' cặp người × dự án, '+miss.length+' còn thiếu.</div>';
  html+='<section class="panel"><div class="scroll"><table><thead><tr><th>Người</th><th>Dự án</th><th>Đã cập nhật</th><th>Hạng mục còn thiếu</th></tr></thead><tbody>'+
   (miss.length?miss.sort(function(a,b){return a.person.localeCompare(b.person,'vi')}).map(function(r){var lack=r.active.filter(function(t){return r.upd.indexOf(t)<0});return '<tr><td><b>'+esc(r.person)+'</b></td><td>'+esc(r.p.ten)+' <span class="muted">'+r.p.luong+'</span></td><td class="mono">'+r.upd.length+'/'+r.active.length+'</td><td>'+lack.map(function(t){return '<a class="tl" data-t="'+t.id+'" style="color:var(--accent);cursor:pointer">'+esc(short(t.cap==='nhom'?'Nhóm '+t.nhom+' (ghi chung)':t.ten,60))+'</a>'}).join(' · ')+'</td></tr>'}).join(''):'<tr><td colspan="4"><div class="empty">Mọi người đã cập nhật đủ hạng mục đang làm.</div></td></tr>')+
   '</tbody></table></div></section>';
  v.innerHTML=html;bindLuong();bindNoteLinks(v);
}
