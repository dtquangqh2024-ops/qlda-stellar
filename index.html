function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

function vProject(v){
  if(!S.pj||!IX.pj[S.pj])return vProjectList(v);

  html+='<section class="panel lu-'+p.luong+'" style="border-left:4px solid var(--lc)"><div class="bd phead"><div class="info"><div class="eyebrow">'+lchip(p.luong)+' · '+esc(p.loai_hinh)+' · mẫu '+esc(p.mau)+' · '+esc(p.ma)+'</div><h1>'+esc(p.ten)+'</h1>'+
    '<div class="muted" style="font-size:13px">'+(p.ten_thuong_mai?'Tên thương mại: <b style="color:var(--ink)">'+esc(p.ten_thuong_mai)+'</b> · ':'')+(p.ten_goi_khac?'Tên khác: '+esc(p.ten_goi_khac):'')+'</div>'+
    '<div class="row"><span class="rag '+h.rag+'">'+h.rag+'</span><span class="st '+(p.trang_thai==='Đang chạy'?'run':'stop')+'">'+esc(p.trang_thai)+'</span><span class="muted" style="font-size:12px">'+esc(h.why.join(' · '))+'</span></div>'+
    '<div class="row" style="margin-top:4px">'+lkRow(p.ma)+(canLinkNew(p.ma)?'<button class="btn sm" id="pjLinks">'+((IX.links[p.ma]||[]).length?'Quản lý nút hồ sơ':'+ Nút hồ sơ')+'</button>':'')+'</div></div>';
  html+='<div style="flex:1;min-width:260px"><div class="eyebrow" style="margin-bottom:6px">Mốc CĐT</div><div class="moc">'+(IX.moc[p.ma]||[]).map(function(m){var c=m.ngay_cdt?(m.ngay_cdt<w?'past':(m.ngay_cdt<=add(w,30)?'soon':'')):'';return '<div class="'+c+'"><span class="muted" style="font-size:12px">'+esc(m.moc)+'</span><b>'+(m.ngay_cdt?dmy(m.ngay_cdt):'–')+'</b></div>'}).join('')+'</div></div></div></section>';
  // nhóm
  var groups=[],cur=null;
  var gmap={};
  ts.forEach(function(t){if(t.cap==='moc')return;
    if(t.cap==='nhom'||!cur||cur.code!==t.nhom){
      var ex=t.cap!=='nhom'&&gmap[t.nhom];
      if(ex)cur=ex;else{cur={code:t.nhom,head:t.cap==='nhom'?t:null,name:t.ten_nhom,items:[]};groups.push(cur);if(!gmap[t.nhom])gmap[t.nhom]=cur}}
    if(t.cap==='hangmuc')cur.items.push(t)});
  var EDIT=canReview()&&S.editPj===p.ma;
  html+='<section class="panel"><div class="hd"><h2>Hạng mục theo nhóm</h2><span class="sp muted" style="font-size:12px">'+(EDIT?'Sửa trực tiếp trong bảng, mỗi ô tự lưu khi rời ô':'Bấm một hạng mục để xem lịch sử và cập nhật')+'</span>'+(canReview()?'<button class="btn sm'+(EDIT?' pri':'')+'" id="editPj">'+(EDIT?'✓ Xong':'✎ Chỉnh sửa')+'</button>':'')+'</div>';
  groups.forEach(function(g){
    var all=g.items.concat(g.head?[g.head]:[]),nWeek=0,last='';
    all.forEach(function(t){(IX.notesByTask[t.id]||[]).forEach(function(n){if(n.tuan===w)nWeek++;if(n.tuan<=w&&n.tuan>last)last=n.tuan})});
    var done=g.items.filter(function(t){return DONE.indexOf(tStatus(t))>=0}).length;
    var gk=p.ma+'|'+g.code,open=S.open[gk]!==undefined?S.open[gk]:(nWeek>0||!IX.notesByPj[p.ma].length||g.items.some(function(t){return RUN.indexOf(tStatus(t))>=0}));
    html+='<details class="grp2" data-gk="'+esc(gk)+'"'+(open?' open':'')+'><summary><span class="n">'+esc(g.code)+'</span><b style="flex:1;min-width:200px">'+esc(g.name)+'</b>'+
      (g.head&&g.head.deadline_cdt?'<span class="muted mono" style="font-size:12px">DL '+dmy(g.head.deadline_cdt)+'</span>':'')+
      '<span class="chip">'+done+'/'+g.items.length+' xong</span>'+(nWeek?'<span class="chip" style="background:var(--accent-soft);color:var(--accent)">'+nWeek+' ghi chú tuần này</span>':'')+(last?'<span class="muted" style="font-size:12px">gần nhất '+dm(last)+'</span>':'')+'</summary>';
    if(canReview())html+='<div class="row" style="padding:0 16px 10px">'+
      '<label class="muted" style="font-size:12px">Giao cả nhóm cho <select data-gn="'+esc(g.code)+'"><option value=""></option>'+IX.people.map(function(x){return '<option'+(g.head&&g.head.nguoi_pt===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label><button class="btn sm" data-ga="'+esc(g.code)+'">Áp dụng</button>'+
      '<span style="flex:1"></span><input type="text" data-tn="'+esc(g.code)+'" placeholder="Tên hạng mục mới" style="min-width:200px"><button class="btn sm" data-ta="'+esc(g.code)+'">+ Thêm hạng mục</button></div>';
    html+='<div class="scroll"><table class="stick"><thead><tr><th>Hạng mục</th><th>Phụ trách</th><th>Deadline CĐT</th><th>Trạng thái</th><th>Ghi chú gần nhất</th></tr></thead><tbody>';
    (g.head?[g.head]:[]).concat(g.items).forEach(function(t){
      var ns=(IX.notesByTask[t.id]||[]).filter(function(n){return n.tuan<=w}).sort(function(a,b){return a.tuan<b.tuan?1:-1});
      if(EDIT){html+=editRow(t,ns[0]);return}
      var st=tStatus(t),late=t.deadline_cdt&&t.deadline_cdt<w&&DONE.indexOf(st)<0;
      html+='<tr class="click" data-t="'+t.id+'"'+(t.cap==='nhom'?' style="font-style:italic"':'')+'><td class="hm">'+(t.cap==='nhom'?'':'<span class="mono muted">'+esc(t.stt)+'.</span> ')+(t.cap==='nhom'?'<span class="muted">Ghi chung của nhóm</span>':esc(t.ten))+(t.can_ra?' <span class="tag ra" title="'+esc(t.can_ra)+'">Chờ rà</span>':'')+'</td><td>'+esc(t.nguoi_pt)+'</td>'+
        '<td class="mono" style="'+(late?'color:var(--crit)':'')+'">'+dmy(t.deadline_cdt)+'</td>'+
        '<td>'+(st?'<span class="st '+stCls(st)+'">'+esc(st)+'</span>':(t.tinh_trang_goc&&t.cap==='hangmuc'?'<span class="muted" style="font-size:12px">'+esc(short(t.tinh_trang_goc,30))+'</span>':''))+'</td>'+
        '<td style="min-width:240px;max-width:420px">'+(ns[0]?'<span class="mono muted" style="font-size:12px">'+dm(ns[0].tuan)+'</span> '+esc(short(ns[0].noi_dung,140)):'')+'</td></tr>';
    });
    html+='</tbody></table></div></details>';
  });
  html+='</section>';
  v.innerHTML=html;
  document.getElementById('back').onclick=function(){go('du-an',null)};
  var pl=document.getElementById('pjLinks');if(pl)pl.onclick=function(){openLinks(p.ma)};
  var eb=document.getElementById('editPj');if(eb)eb.onclick=function(){S.editPj=S.editPj===p.ma?null:p.ma;render()};
  if(EDIT)bindEdit(v);
  if(!EDIT)v.querySelectorAll('tr[data-t]').forEach(function(r){r.onclick=function(){openTask(r.dataset.t)}});
  v.querySelectorAll('details[data-gk]').forEach(function(d){d.addEventListener('toggle',function(){S.open[d.dataset.gk]=d.open})});
  v.querySelectorAll('[data-ga]').forEach(function(b){b.onclick=function(){
    var nh=b.dataset.ga,ng=v.querySelector('select[data-gn="'+nh+'"]').value;if(!ng){toast('Chọn người để giao');return}
    b.disabled=true;
    api.assignGroup(p.ma,nh,ng).then(function(ids){ids.forEach(function(id){if(IX.task[id])IX.task[id].nguoi_pt=ng});index();toast('Đã giao '+ids.length+' dòng nhóm '+nh+' cho '+ng);render()}).catch(function(e){b.disabled=false;err(e)});
  }});
  v.querySelectorAll('[data-ta]').forEach(function(b){b.onclick=function(){
    var nh=b.dataset.ta,inp=v.querySelector('input[data-tn="'+nh+'"]'),ten=inp.value.trim();if(!ten){toast('Nhập tên hạng mục');inp.focus();return}
    b.disabled=true;
    api.addTask({ma_da:p.ma,nhom:nh,ten:ten}).then(function(r){S.data.CongViec.push(r);index();toast('Đã thêm hạng mục');render()}).catch(function(e){b.disabled=false;err(e)});
  }});
}

function editRow(t,n){
  var dmL=S.data.DanhMuc,hm=t.cap==='hangmuc';

  return '<tr class="erow" data-t="'+t.id+'">'+
    '<td class="hm">'+(hm?'<div class="row" style="gap:4px;flex-wrap:nowrap"><span class="mono muted">'+esc(t.stt)+'.</span><input type="text" data-f="ten" value="'+esc(t.ten)+'" style="flex:1;min-width:0"></div>':'<span class="muted">Ghi chung của nhóm</span>')+
      '<div class="row" style="gap:8px;margin-top:4px"><a class="act" data-open="'+t.id+'">Lịch sử</a>'+(hm?'<a class="act del" data-del="'+t.id+'">Bớt</a>':'')+'</div></td>'+
    '<td><select data-f="nguoi_pt">'+opt(IX.people,t.nguoi_pt)+'</select></td>'+
    '<td><input type="date" data-f="deadline_cdt" value="'+esc(t.deadline_cdt)+'"></td>'+

    '<td class="enote">'+(n?'<input type="date" data-nf="tuan" data-n="'+esc(n.id)+'" value="'+esc(n.tuan)+'" title="Thông tin của ngày (lưu theo tuần chứa ngày này)"><textarea rows="2" data-nf="noi_dung" data-n="'+esc(n.id)+'">'+esc(n.noi_dung)+'</textarea>':
      '<input type="date" data-new="tuan" value="'+(TODAY>=S.week&&TODAY<=add(S.week,6)?TODAY:S.week)+'"><textarea rows="2" data-new="noi_dung" placeholder="Thêm ghi chú…"></textarea>')+'</td></tr>';
}
function saved(el){el.classList.remove('err');el.classList.add('ok');setTimeout(function(){el.classList.remove('ok')},1200)}
function bindEdit(v){
  v.querySelectorAll('tr.erow').forEach(function(tr){
    var id=tr.dataset.t,t=IX.task[id];
    tr.querySelectorAll('[data-f]').forEach(function(el){el.onchange=function(){
      var k=el.dataset.f,val=el.value;if(k==='ten'&&!val.trim()){el.value=t.ten;toast('Tên hạng mục không được để trống');return}
      var pl={id:id};pl[k]=val;
      api.updateTask(pl).then(function(ch){Object.assign(t,ch);index();saved(el)}).catch(function(e){el.classList.add('err');err(e)});
    }});
    tr.querySelectorAll('[data-nf]').forEach(function(el){el.onchange=function(){
      var n=S.data.BaoCaoTuan.filter(function(x){return x.id===el.dataset.n})[0];if(!n)return;
      var pl={id:n.id};
      if(el.dataset.nf==='tuan'){if(!el.value){el.value=n.tuan;return}pl.tuan=mon(el.value)}else{if(!el.value.trim()){el.value=n.noi_dung;toast('Muốn xóa ghi chú thì mở Lịch sử');return}pl.noi_dung=el.value.trim()}
      api.updateNote(pl).then(function(ch){Object.assign(n,ch);if(ch.tuan)el.value=ch.tuan;index();saved(el)}).catch(function(e){el.classList.add('err');err(e)});
    }});
    var nt=tr.querySelector('[data-new="noi_dung"]');
    if(nt)nt.onchange=function(){
      var txt=nt.value.trim();if(!txt)return;
      var day=tr.querySelector('[data-new="tuan"]').value||S.week;nt.disabled=true;
      api.addNote({ma_da:t.ma_da,cv_id:id,tuan:mon(day),loai:'Đã làm',loai_vm:'',noi_dung:txt}).then(function(r){S.data.BaoCaoTuan.push(r);index();
        nt.disabled=false;nt.dataset.new='';nt.dataset.nf='noi_dung';nt.dataset.n=r.id;var dd=tr.querySelector('[data-new="tuan"]');dd.dataset.new='';dd.dataset.nf='tuan';dd.dataset.n=r.id;dd.value=r.tuan;saved(nt);bindEdit(v)}).catch(function(e){nt.disabled=false;err(e)});
    };
    var del=tr.querySelector('[data-del]');
    if(del)del.onclick=function(){
      if(!del.dataset.ok){del.dataset.ok='1';del.textContent='Bấm lần nữa';return}
      api.deleteTask(id).then(function(){t.cap='xoa';index();tr.remove();toast('Đã bớt "'+short(t.ten,40)+'"')}).catch(err);
    };
    var op=tr.querySelector('[data-open]');if(op)op.onclick=function(){openTask(id)};
  });
}

  v.querySelectorAll('tr[data-pj]').forEach(function(r){r.onclick=function(){go('du-an',r.dataset.pj)}});
  var nb=document.getElementById('newPj');if(nb)nb.onclick=openNewProject;

  var list=mine.filter(function(t){
    if(S.myFilter==='tat-ca')return true;
    var st=tStatus(t),ns=IX.notesByTask[t.id]||[];
    if(ns.some(function(n){return n.tuan===w}))return true;
    if(DONE.indexOf(st)>=0)return false;
    return RUN.indexOf(st)>=0||(Number(t.tien_do)>0&&Number(t.tien_do)<1)||ns.some(function(n){return n.tuan>=add(w,-28)&&n.tuan<w})||(t.deadline_cdt&&t.deadline_cdt>=w&&t.deadline_cdt<=add(w,28));
  });
  var dkey='qltk_draft_'+person+'_'+w,draft={};try{draft=JSON.parse(store(dkey)||'{}')}catch(e){}
  var saveDraft=function(){store(dkey,JSON.stringify(draft))};
  var planOf=function(t){
    var ns=IX.notesByTask[t.id]||[];
    var p=ns.filter(function(n){return n.tuan===prev&&n.loai==='KH tuần tới'});
    if(!p.length)p=ns.filter(function(n){return n.tuan===w&&n.nguon==='Excel gốc'});
    if(!p.length)p=ns.filter(function(n){return n.tuan===prev});
    return p.map(function(n){return n.noi_dung}).join('\n');
  };
  var doneW=function(t){return (IX.notesByTask[t.id]||[]).some(function(n){return n.tuan===w&&n.nguon!=='Excel gốc'})};
  var nDone=list.filter(doneW).length;
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tuần '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Nhập báo cáo</h1></div>'+
   '<div class="filters">'+(canReview()?'<label class="muted" style="font-size:12px">Người <select id="mp">'+IX.people.map(function(p){return '<option'+(p===person?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></label>':'')+
   '<div class="seg" id="mf">'+[['dang','Cần báo cáo'],['tat-ca','Tất cả được giao']].map(function(x){return '<button data-f="'+x[0]+'" class="'+(S.myFilter===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div></div>';
  html+='<div class="qbar"><div class="qprog"><b class="mono">'+nDone+'/'+list.length+'</b> hạng mục đã báo cáo tuần này<i><b style="width:'+(list.length?nDone/list.length*100:0)+'%"></b></i></div>'+
   '<div class="muted" style="font-size:12px">Mỗi hạng mục chọn 1 nút: <b>Đúng kế hoạch</b> nếu làm như đã hẹn tuần trước; <b>Có thay đổi</b> hoặc <b>Vướng</b> thì ghi 1 dòng; <b>Không phát sinh</b> nếu tuần này không có việc. Ghi kế hoạch tuần tới rồi bấm Gửi.</div></div>';
  if(!can)html+='<div class="hint">Bạn đang xem báo cáo của '+esc(person)+'. Chỉ người đó hoặc người duyệt gửi được.</div>';
  if(!list.length)html+='<div class="panel"><div class="empty">Không có hạng mục nào cần báo cáo tuần này. Chọn "Tất cả được giao" nếu muốn ghi thêm.</div></div>';
  var by={};list.forEach(function(t){(by[t.ma_da]=by[t.ma_da]||[]).push(t)});
  Object.keys(by).sort(function(a,b){return lord(IX.pj[a],IX.pj[b])}).forEach(function(ma){
    var p=IX.pj[ma];
    html+='<section class="panel lu-'+p.luong+'"><div class="hd lu"><h2>'+esc(p.ten)+'</h2>'+lchip(p.luong)+'<span class="sp muted" style="font-size:12px">'+by[ma].filter(doneW).length+'/'+by[ma].length+' đã báo cáo</span><button class="btn sm" data-lk="'+ma+'">'+((IX.links[ma]||[]).length?'Hồ sơ ('+(IX.links[ma]||[]).length+')':'+ Nút hồ sơ')+'</button></div><div class="qlist">';
    by[ma].forEach(function(t){
      var plan=planOf(t),dr=draft[t.id]||{},now=(IX.notesByTask[t.id]||[]).filter(function(n){return n.tuan===w&&n.nguon!=='Excel gốc'});
      var name=t.cap==='nhom'?'Ghi chung nhóm '+t.nhom+': '+short(t.ten_nhom,60):t.ten;
      html+='<div class="qi'+(now.length?' sent':'')+'" data-q="'+t.id+'"><div class="qh"><div class="nm">'+esc(name)+'<div class="muted" style="font-size:12px;font-weight:400">'+(t.deadline_cdt?'Deadline CĐT <span class="mono">'+dmy(t.deadline_cdt)+'</span> · ':'')+(tStatus(t)?'<span class="st '+stCls(tStatus(t))+'">'+esc(tStatus(t))+'</span>':'Chưa có trạng thái')+'</div></div><button class="btn sm" data-open="'+t.id+'">Chi tiết</button></div>'+
        (plan?'<div class="hint"><b>Kế hoạch đã hẹn:</b> '+esc(short(plan,320))+'</div>':'')+
        (now.length?'<div class="hint" style="background:var(--good-soft);color:var(--ink)"><b>Đã gửi tuần này:</b> '+esc(now.map(function(n){return (n.loai==='KH tuần tới'?'KH tuần tới: ':'')+n.noi_dung}).join(' · '))+'</div>':'')+
        (can?'<div class="qbtns">'+[['ok','✓ Đúng kế hoạch'],['doi','✎ Có thay đổi'],['vm','⚠ Vướng'],['khong','– Không phát sinh']].map(function(b){return '<button class="qb '+b[0]+(dr.k===b[0]?' on':'')+'" data-k="'+b[0]+'"'+(b[0]==='ok'&&!plan?' disabled title="Tuần trước chưa có kế hoạch"':'')+'>'+b[1]+'</button>'}).join('')+'</div>'+
          '<div class="qmore"'+(dr.k==='doi'||dr.k==='vm'?'':' hidden')+'><div class="row">'+'<select class="qvm"'+(dr.k==='vm'?'':' hidden')+'>'+S.data.DanhMuc.loai_vm.map(function(x){return '<option'+(dr.vm===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><textarea class="qtx" rows="2" placeholder="Ghi 1 dòng: đã làm gì / vướng gì">'+esc(dr.tx||'')+'</textarea></div>'+
          '<div class="qplan"><input type="text" class="qkh" placeholder="Kế hoạch tuần tới'+(plan?' (bấm Giữ để chép kế hoạch cũ)':'')+'" value="'+esc(dr.kh||'')+'">'+(plan?'<button class="btn sm qkeep">Giữ</button>':'')+'</div>':'')+
        '</div>';
    });
    html+='</div></section>';
  });
  if(can&&list.length)html+='<div class="qsend"><div class="wrap row" style="justify-content:space-between"><span id="qcount" class="muted" style="font-size:13px"></span><button class="btn pri" id="qgo">Gửi báo cáo tuần</button></div></div>';
  v.innerHTML=html;
  var plans={};list.forEach(function(t){plans[t.id]=planOf(t)});
  var count=function(){var n=Object.keys(draft).filter(function(k){var d=draft[k];return d.k||d.kh}).length;var e=document.getElementById('qcount');if(e)e.textContent=n?n+' hạng mục đã chọn, chưa gửi':'Chưa chọn hạng mục nào';};
  count();
  var mpEl=document.getElementById('mp');if(mpEl)mpEl.onchange=function(){S.person=this.value;render()};
  document.querySelectorAll('#mf button').forEach(function(b){b.onclick=function(){S.myFilter=b.dataset.f;render()}});
  v.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openTask(b.dataset.open)}});
  v.querySelectorAll('[data-lk]').forEach(function(b){b.onclick=function(){openLinks(b.dataset.lk)}});
  v.querySelectorAll('.qi').forEach(function(el){
    var id=el.dataset.q,d=function(){return draft[id]||(draft[id]={})};
    el.querySelectorAll('.qb').forEach(function(b){b.onclick=function(){
      var dd=d();dd.k=dd.k===b.dataset.k?'':b.dataset.k;
      el.querySelectorAll('.qb').forEach(function(x){x.classList.toggle('on',x.dataset.k===dd.k)});
      var more=el.querySelector('.qmore');more.hidden=!(dd.k==='doi'||dd.k==='vm');el.querySelector('.qvm').hidden=dd.k!=='vm';
      if(!more.hidden)el.querySelector('.qtx').focus();
      saveDraft();count();
    }});
    var tx=el.querySelector('.qtx');if(tx)tx.oninput=function(){d().tx=tx.value;saveDraft()};
    var vm=el.querySelector('.qvm');if(vm)vm.onchange=function(){d().vm=vm.value;saveDraft()};
    var kh=el.querySelector('.qkh');if(kh)kh.oninput=function(){d().kh=kh.value;saveDraft();count()};
    var keep=el.querySelector('.qkeep');if(keep)keep.onclick=function(){kh.value=plans[id];d().kh=kh.value;saveDraft();count()};
  });
  var go=document.getElementById('qgo');
  if(go)go.onclick=function(){
    var notes=[],bad=[];
    Object.keys(draft).forEach(function(id){
      var dd=draft[id],t=IX.task[id];if(!t)return;
      var base={ma_da:t.ma_da,cv_id:id,tuan:w};
      if(dd.k==='ok')notes.push(Object.assign({loai:'Đã làm',noi_dung:'Đúng kế hoạch: '+(plans[id]||'')},base));
      else if(dd.k==='khong')notes.push(Object.assign({loai:'Đã làm',noi_dung:'Không phát sinh trong tuần'},base));
      else if(dd.k==='doi'||dd.k==='vm'){
        if(!String(dd.tx||'').trim()){bad.push(t.ten);return}
        notes.push(Object.assign(dd.k==='vm'?{loai:'Vướng mắc',loai_vm:dd.vm||S.data.DanhMuc.loai_vm[0]}:{loai:'Đã làm'},{noi_dung:dd.tx.trim()},base));
      }
      if(String(dd.kh||'').trim())notes.push(Object.assign({loai:'KH tuần tới',noi_dung:dd.kh.trim()},base));
    });
    if(bad.length){toast('Còn thiếu nội dung ở: '+short(bad.join(', '),80));return}
    if(!notes.length){toast('Chưa chọn hạng mục nào');return}
    go.disabled=true;go.textContent='Đang gửi…';
    api.addNotes(notes,person).then(function(rows){
      rows.forEach(function(r){S.data.BaoCaoTuan.push(r)});draft={};store(dkey,null);index();
      toast('Đã gửi '+rows.length+' ghi chú');render();
    }).catch(function(e){go.disabled=false;go.textContent='Gửi báo cáo tuần';err(e)});
  };
}

/* ================= BÁO CÁO TUẦN (THẺ) ================= */
/* Phân loại ghi chú theo 4 nút nhập: Đúng kế hoạch · Có thay đổi · Vướng · Không phát sinh.
   Ghi chú cũ (Excel, ô "Đã làm" tự do) tạm xếp vào "Có thay đổi". "KH tuần tới" hiện riêng. */
var KQ=[['ok','Đúng kế hoạch','✓'],['doi','Có thay đổi','✎'],['vm','Vướng','⚠'],['khong','Không phát sinh','–']];
function kqOf(n){
  if(n.nguon==='Excel gốc')return n.loai==='Vướng mắc'?'vm':'doi';
  if(n.loai==='KH tuần tới')return 'kh';
  if(n.loai==='Vướng mắc')return 'vm';
  var t=String(n.noi_dung||'');
  if(/^Đúng kế hoạch/.test(t))return 'ok';
  if(/^Không phát sinh/.test(t))return 'khong';
  return 'doi';
}
function vBoard(v){
  var w=S.week,ps=projects(),notes=S.data.BaoCaoTuan.filter(function(n){return n.tuan===w});
  ps=ps.filter(function(p){return p.trang_thai==='Đang chạy'||notes.some(function(n){return n.ma_da===p.ma})});
  var tot={ok:0,doi:0,vm:0,khong:0};notes.forEach(function(n){var k=kqOf(n);if(tot[k]!=null&&(!S.luong||(IX.pj[n.ma_da]||{}).luong===S.luong))tot[k]++});
  var html='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Tuần '+weekNo(w)+' · '+dm(w)+'–'+dmy(add(w,6))+'</div><h1>Báo cáo tuần</h1></div>'+luongSeg()+'</div>';
  html+='<div class="kqleg">'+KQ.map(function(k){return '<span class="kq '+k[0]+'">'+k[2]+' '+k[1]+' <b class="mono">'+tot[k[0]]+'</b></span>'}).join('')+'<span class="muted" style="font-size:12px">Ghi chú nhập trước khi có 4 nút được tạm tính là "Có thay đổi".</span></div>';
  LUONG.forEach(function(L){
    var g=ps.filter(function(p){return p.luong===L});if(!g.length)return;
    html+='<div class="bgrp lu-'+L+'">'+L+' · '+g.length+' dự án</div><div class="board">';
    g.forEach(function(p){
      var h=health(p),ns=notes.filter(function(n){return n.ma_da===p.ma}),lw=lastWeek(p),age=lw?Math.round(days(lw,w)/7):null;
      var c={ok:0,doi:0,vm:0,khong:0},plans=[],main=[];
      ns.forEach(function(n){var k=kqOf(n);if(k==='kh')plans.push(n);else{c[k]++;main.push(n)}});
      var rank={vm:0,doi:1,ok:2,khong:3};main.sort(function(a,b){return rank[kqOf(a)]-rank[kqOf(b)]});
      var who={};ns.forEach(function(n){if(n.nguoi_nhap)who[n.nguoi_nhap]=1});
      html+='<article class="bcard" data-pj="'+p.ma+'"><div class="bh">'+pnHtml(p,h)+(p.trang_thai!=='Đang chạy'?'<span class="st stop">'+esc(p.trang_thai)+'</span>':'')+'</div>'+
        '<div class="kqrow">'+KQ.map(function(k){return c[k[0]]?'<span class="kq '+k[0]+'">'+k[2]+' '+c[k[0]]+'</span>':''}).join('')+'</div>'+
        (main.length?'<div class="blist">'+main.slice(0,4).map(function(n){var t=IX.task[n.cv_id];return '<div class="bl '+kqOf(n)+'" data-t="'+esc(n.cv_id)+'"><b>'+esc(short(t?(t.cap==='nhom'?t.ten_nhom:t.ten):'',48))+'</b> '+esc(short(String(n.noi_dung).replace(/^Đúng kế hoạch:\s*/,''),110))+'</div>'}).join('')+
          (main.length>4?'<a class="more" data-more="'+p.ma+'">+ '+(main.length-4)+' ghi chú khác</a>':'')+'</div>':'<div class="bempty">Chưa có cập nhật tuần này</div>')+
        (plans.length?'<div class="bplan"><b>KH tuần tới:</b> '+esc(short(plans.map(function(n){return n.noi_dung}).join(' · '),140))+'</div>':'')+
        ((IX.links[p.ma]||[]).length?'<details class="bmore"><summary>Hồ sơ liên quan ('+(IX.links[p.ma]||[]).length+')</summary>'+lkRow(p.ma)+(canLinkNew(p.ma)?'<a class="more" data-lk="'+p.ma+'">Quản lý nút</a>':'')+'</details>':'')+
        '<div class="bf"><span>'+(lw?'Cập nhật: <b class="mono">'+dmy(lw)+'</b>':'Chưa có cập nhật')+(Object.keys(who).length?' · '+esc(Object.keys(who).join(', ')):'')+'</span>'+
        (lw&&age>0?'<span class="st '+(age>=2?'wait':'')+'">'+age+' tuần trước</span>':'')+
        (canReview()?'<select class="brag" data-rg="'+p.ma+'" aria-label="RAG '+esc(p.ten)+'">'+['','Xanh','Vàng','Đỏ','Xám'].map(function(x){return '<option value="'+x+'"'+(((h.rev||{}).rag||'')===x?' selected':'')+'>'+(x?'RAG '+x:'RAG tự động')+'</option>'}).join('')+'</select>':'')+
        '</div></article>';
    });
    html+='</div>';
  });
  if(!ps.length)html+='<div class="panel"><div class="empty">Không có dự án nào trong bộ lọc này.</div></div>';
  v.innerHTML=html;bindLuong();
  v.querySelectorAll('.bl[data-t]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();openTask(e.dataset.t)}});
  v.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();go('du-an',e.dataset.more)}});
  v.querySelectorAll('[data-lk]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();openLinks(e.dataset.lk)}});
  v.querySelectorAll('.bcard .bh b').forEach(function(e){e.style.cursor='pointer';e.onclick=function(){go('du-an',e.closest('.bcard').dataset.pj)}});
  v.querySelectorAll('select.brag').forEach(function(sel){sel.onclick=function(ev){ev.stopPropagation()};sel.onchange=function(){
    var ma=sel.dataset.rg,old=IX.review[ma+'|'+S.week]||{};sel.disabled=true;
    api.setReview({ma_da:ma,tuan:S.week,rag:sel.value,giai_doan:old.giai_doan||'',thanh_qua:old.thanh_qua||'',diem_nong:old.diem_nong||''})
      .then(function(r){S.data.DanhGiaTuan=S.data.DanhGiaTuan.filter(function(x){return !(x.ma_da===ma&&x.tuan===S.week)});S.data.DanhGiaTuan.push(r);index();toast('Đã lưu RAG '+pjName(ma));render()}).catch(function(e){sel.disabled=false;err(e)});
  }});
}

/* ================= TRA CỨU ================= */
var SQ={q:'',pj:'',who:'',vm:''};
function vSearch(v){
  var html='<div class="row" style="justify-content:space-between"><h1>Tra cứu ghi chú</h1></div><div class="filters">'+
    '<input type="search" id="sq" placeholder="Từ khóa, ví dụ PCCC, thanh toán, thẩm định" value="'+esc(SQ.q)+'" style="flex:1;min-width:220px">'+
    '<select id="spj"><option value="">Mọi dự án</option>'+S.data.DuAn.map(function(p){return '<option value="'+p.ma+'"'+(SQ.pj===p.ma?' selected':'')+'>'+esc(p.ten)+'</option>'}).join('')+'</select>'+
    '<select id="swho"><option value="">Mọi người</option>'+IX.people.map(function(p){return '<option'+(SQ.who===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'+
    '<select id="svm"><option value="">Mọi loại</option><option value="*"'+(SQ.vm==='*'?' selected':'')+'>Chỉ vướng mắc</option>'+S.data.DanhMuc.loai_vm.map(function(x){return '<option'+(SQ.vm===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'<option value="ra"'+(SQ.vm==='ra'?' selected':'')+'>Chờ rà</option></select></div><div id="sres"></div>';
  v.innerHTML=html;
  var run=function(){
    var q=SQ.q.trim().toLowerCase();
    var r=S.data.BaoCaoTuan.filter(function(n){
      if(SQ.pj&&n.ma_da!==SQ.pj)return false;
      if(SQ.who&&n.nguoi_nhap!==SQ.who)return false;
      if(SQ.vm==='*'&&!(n.loai==='Vướng mắc'||n.loai_vm))return false;
      if(SQ.vm==='ra'&&n.tinh_trang!=='Chờ rà')return false;
      if(SQ.vm&&SQ.vm!=='*'&&SQ.vm!=='ra'&&n.loai_vm!==SQ.vm)return false;
      return !q||String(n.noi_dung).toLowerCase().indexOf(q)>=0;
    }).sort(function(a,b){return a.tuan<b.tuan?1:-1});
    var pjs={};r.forEach(function(n){pjs[n.ma_da]=1});
    document.getElementById('sres').innerHTML=(S.oldLoaded?'':'<div class="hint">Đang tải ghi chú trước '+dmy(S.data.tu_tuan)+'… kết quả sẽ tự bổ sung.</div>')+'<section class="panel"><div class="hd"><h2>'+r.length+' ghi chú</h2><span class="muted" style="font-size:12px">ở '+Object.keys(pjs).length+' dự án'+(r.length>200?' · hiện 200 ghi chú mới nhất':'')+'</span></div><div class="bd">'+(r.length?'<div class="list">'+r.slice(0,200).map(function(n){return noteLi(n,SQ.q.trim())}).join('')+'</div>':'<div class="empty">Không có ghi chú khớp.</div>')+'</div></section>';
    bindNoteLinks(document.getElementById('sres'));
  };
  var t;document.getElementById('sq').oninput=function(){SQ.q=this.value;clearTimeout(t);t=setTimeout(run,200)};
  document.getElementById('spj').onchange=function(){SQ.pj=this.value;run()};
  document.getElementById('swho').onchange=function(){SQ.who=this.value;run()};
  document.getElementById('svm').onchange=function(){SQ.vm=this.value;run()};
  run();
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
/* Dùng cho kiểm thử tự động */
window.__app={get S(){return S},get IX(){return IX},openTask:openTask,render:render,canLinkEdit:canLinkEdit,canLinkNew:canLinkNew};

if(!LIVE&&!S.user)S.user={ten:'Quang',vai_tro:'Trưởng'};
if(S.user&&(S.token||!LIVE))boot();else{S.user=null;render()}
